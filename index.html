<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1a24" />
    <!-- установка на экран «Домой»: игра открывается на весь экран, без адресной строки -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Улак Тартыш" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <title>Улак Тартыш</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage">
      <div id="app"></div>

      <div id="hud" class="hidden">
      <div id="hud-buttons">
        <button id="btn-pause" aria-label="pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5v14M15.5 5v14" stroke-width="3"/></svg></button>
        <button id="btn-full" aria-label="fullscreen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
        <button id="btn-mute" aria-label="sound"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11"/></svg></button>
        <button id="btn-help" aria-label="help"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.6 9a3.5 3.5 0 1 1 5.2 3c-1.2.7-1.8 1.4-1.8 2.8"/><circle cx="12" cy="18.6" r=".7" fill="currentColor"/></svg></button>
      </div>
      <div id="scoreboard">
        <div class="team team-0"><span class="tname">Көк</span><span id="score0" class="score">0</span></div>
        <div id="timer">3:00</div>
        <div class="team team-1"><span id="score1" class="score">0</span><span class="tname">Кызыл</span></div>
      </div>
      <canvas id="minimap" width="220" height="132"></canvas>
      <div id="possession"></div>
      <div id="banner"></div>
      <div id="bars">
        <div class="bar-label" data-i18n="stamina"></div>
        <div class="bar"><div id="stamina-fill"></div></div>
        <div id="charge-wrap" class="hidden">
          <div class="bar-label" data-i18n="throwPower"></div>
          <div class="bar charge"><div id="charge-fill"></div></div>
        </div>
      </div>
      <div id="ulak-arrow">▲</div>
      <div id="rotate-hint" data-i18n="rotate"></div>

      <!-- сенсорное управление -->
      <div id="touch" class="hidden">
        <div id="stick-zone"><div id="stick"><i></i></div></div>
        <div id="touch-buttons">
          <button id="tb-pass" data-i18n="btnPass"></button>
          <button id="tb-feint" data-i18n="btnFeint"></button>
          <button id="tb-sprint" data-i18n="btnSprint"></button>
          <button id="tb-action" data-i18n="btnSteal"></button>
        </div>
      </div>
      </div>

      <div id="duel" class="hidden">
      <div class="duel-title"></div>
      <div class="duel-q"></div>
      <div class="duel-opts"></div>
      <div class="duel-bar"><i></i></div>
      </div>

      <div id="view3d" class="hidden"><button id="view3d-close" data-i18n="close"></button></div>

      <div id="menu" class="overlay"></div>
    </div>

    <!-- iPhone: подсказка «проведите вверх», чтобы Safari убрал свои панели -->
    <div id="swipe-up"><b>⬆</b><span data-i18n="swipeUp"></span><small data-i18n="swipeUpClose"></small></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
